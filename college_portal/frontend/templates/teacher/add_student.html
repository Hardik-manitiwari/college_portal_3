{% extends "base.html" %}
{% block title %}Add student — {{ school_class.name }}{% endblock %}

{% block nav %}
  <a href="{{ url_for('teacher_dashboard') }}">Dashboard</a>
  <a href="{{ url_for('teacher_generate_qr') }}">Generate QR</a>
  <a href="{{ url_for('teacher_failsafe') }}">Failsafe scan</a>
  <a href="{{ url_for('teacher_homework') }}">Homework</a>
  <a href="{{ url_for('teacher_message_parents') }}">Message parents</a>
{% endblock %}

{% block content %}
  <h1>Add a student</h1>
  <p class="subtitle">to {{ school_class.name }}</p>

  <div class="card form-narrow">
    <form method="POST">
      <div class="form-row">
        <label>Full name</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-row">
        <label>Roll number</label>
        <input type="text" name="roll_number" required>
      </div>
      <div class="form-row">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-row">
        <label>Temporary password</label>
        <input type="text" name="password" placeholder="Leave blank for default: student123">
      </div>
      <div class="form-row">
        <label>Parent/guardian name</label>
        <input type="text" name="parent_name" placeholder="For WhatsApp message signatures">
      </div>
      <div class="form-row">
        <label>Parent WhatsApp number (with country code, digits only)</label>
        <input type="text" name="parent_phone" placeholder="e.g. 919812345678">
      </div>
      <button type="submit" class="btn">Add student</button>
      <a href="{{ url_for('teacher_students', class_id=school_class.id) }}" class="btn secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
